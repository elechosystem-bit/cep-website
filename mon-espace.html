<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Mon espace — CEP75</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--noir:#080c14;--bleu:#162040;--bleu-mid:#1e2f5c;--or:#c9a84c;--or-pale:#e8c96a;--or-clair:#f0d080;--texte:#aeb7cc}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 60% at 50% 0%,var(--bleu-mid),var(--bleu) 45%,var(--noir));color:#fff;font-family:'Barlow',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}
.eye{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--or);margin:0}
h1{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:400;font-size:2.2rem;line-height:1.2;color:var(--or-pale);margin:0;text-wrap:balance}
p{margin:0;color:var(--texte);font-size:1.02rem;line-height:1.55}
.tel{font-family:'Playfair Display',Georgia,serif;font-size:1.4rem;color:var(--or-pale);text-decoration:none;font-weight:700}
.retour{margin-top:10px;display:inline-flex;align-items:center;min-height:46px;padding:.7rem 1.4rem;border:1px solid var(--or);border-radius:10px;color:var(--or-pale);text-decoration:none;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.retour:hover,.retour:focus-visible,.tel:hover,.tel:focus-visible{color:var(--or-clair);outline:none}
.retour:focus-visible,.tel:focus-visible{outline:2px solid var(--or-clair);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="eye">CEP75</p>
  <h1>Mon espace</h1>
  <p>Votre espace de suivi arrive très bientôt.</p>
  <p>En attendant, pour toute demande, vous pouvez nous joindre au</p>
  <a class="tel" href="tel:0156041996">01 56 04 19 96</a>
  <a class="retour" href="index.html">&larr; Retour au site</a>
</main>
</body>
</html>
